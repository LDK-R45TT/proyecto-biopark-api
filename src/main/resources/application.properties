spring.application.name=biopark

spring.config.import=optional:file:.env[.properties]
#Conexion a Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Esperar a que Hibernate termine de crear/actualizar tablas
spring.jpa.defer-datasource-initialization=true
server.port=8080
#Carga el archivo data.sql al iniciar la app
spring.sql.init.mode=always

#JWT config
jwt.secret=${JWT_SECRET}#se lee automaticamente la llave
jwt.issuer=proyecto-biopark
jwt.roles-claim=roles
jwt.token-type=Bearer
jwt.expiration-time=60


